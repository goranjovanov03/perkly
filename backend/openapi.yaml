openapi: 3.1.0
info:
  title: Perkly API
  version: 1.0.0
servers:
  - url: /api
    description: API server
paths:
  /v1/health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                required: [status]
                example:
                  status: ok
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/login:
    post:
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: ulid
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                    required: [id, name, email]
                required: [user]
              example:
                user:
                  id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                  name: "John Doe"
                  email: "john@example.com"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/logout:
    post:
      summary: User logout
      operationId: logout
      security:
        - sanctum: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
              example:
                message: Logged out
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/logout-all:
    post:
      summary: Logout from all devices
      operationId: logoutAll
      security:
        - sanctum: []
      responses:
        '200':
          description: Logout from all devices successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
              example:
                message: Logged out from all devices
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/forgot-password:
    post:
      summary: Request password reset link
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Password reset email sent (always returns 202 regardless of email existence)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
              example:
                message: If the email exists, a reset link has been sent.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/reset-password:
    post:
      summary: Reset password with token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - email
                - password
                - password_confirmation
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
              example:
                message: Password has been reset.
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/me:
    get:
      summary: Get authenticated user
      operationId: getMe
      security:
        - sanctum: []
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required: [user]
              example:
                user:
                  id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                  name: "John Doe"
                  email: "john@example.com"
                  locale: "mk"
                  onboarded_at: "2026-10-31T12:00:00.000000Z"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      summary: Change password
      operationId: updatePassword
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - password
                - password_confirmation
              properties:
                current_password:
                  type: string
                  format: password
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
              example:
                message: Password updated successfully
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/me/organizations:
    get:
      summary: Get user organizations with active membership
      operationId: getUserOrganizations
      security:
        - sanctum: []
      responses:
        '200':
          description: List of organizations where user has active membership
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationSummary'
                required: [organizations]
              example:
                organizations:
                  - id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                    name: "Acme Inc"
                    slug: "acme-inc"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/me/onboarding/complete:
    post:
      summary: Complete user onboarding
      operationId: completeOnboarding
      security:
        - sanctum: []
      responses:
        '200':
          description: Onboarding completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required: [user]
              example:
                user:
                  id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                  name: "John Doe"
                  email: "john@example.com"
                  locale: "mk"
                  onboarded_at: "2026-10-31T12:00:00.000000Z"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/me/locale:
    patch:
      summary: Update user locale
      operationId: updateLocale
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - locale
              properties:
                locale:
                  type: string
                  enum: [mk, en]
      responses:
        '200':
          description: Locale updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required: [user]
              example:
                user:
                  id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                  name: "John Doe"
                  email: "john@example.com"
                  locale: "en"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/me/notification-preferences:
    get:
      summary: Get notification preferences
      operationId: getNotificationPreferences
      security:
        - sanctum: []
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: boolean
                required: [preferences]
              example:
                preferences:
                  in_app:
                    notification.test: true
                  push:
                    notification.test: true
                  email:
                    notification.test: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      summary: Update notification preferences
      operationId: updateNotificationPreferences
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - preferences
              properties:
                preferences:
                  type: array
                  items:
                    type: object
                    required:
                      - channel
                      - type
                      - enabled
                    properties:
                      channel:
                        type: string
                        enum: [in_app, push, email]
                      type:
                        type: string
                      enabled:
                        type: boolean
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: boolean
                required: [preferences]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/me/devices:
    post:
      summary: Register or update device installation
      operationId: registerDevice
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - platform
                - push_token
              properties:
                platform:
                  type: string
                  enum: [android, ios]
                push_token:
                  type: string
                  maxLength: 500
                app_version:
                  type: string
                  maxLength: 50
                locale:
                  type: string
                  enum: [mk, en]
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  installation:
                    $ref: '#/components/schemas/DeviceInstallation'
                required: [installation]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/me/devices/{id}:
    delete:
      summary: Revoke device installation
      operationId: revokeDevice
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: ulid
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/bootstrap:
    get:
      summary: Get bootstrap data
      operationId: getBootstrap
      security:
        - sanctum: []
      parameters:
        - name: X-Organization-Id
          in: header
          required: false
          schema:
            type: string
            format: ulid
          description: Organization ID
      responses:
        '200':
          description: Bootstrap data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
              example:
                user:
                  id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                  name: "John Doe"
                  email: "john@example.com"
                  locale: "mk"
                  onboarded_at: "2026-10-31T12:00:00.000000Z"
                organizations:
                  - id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                    name: "Acme Inc"
                    slug: "acme-inc"
                current_organization:
                  id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                  name: "Acme Inc"
                  slug: "acme-inc"
                locales:
                  - "mk"
                  - "en"
                default_locale: "mk"
                features: {}
                capabilities:
                  - "organization.view"
                  - "members.view"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/org/current:
    get:
      summary: Get current organization
      operationId: getCurrentOrganization
      security:
        - sanctum: []
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema:
            type: string
            format: ulid
          description: Organization ID
      responses:
        '200':
          description: Current organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    $ref: '#/components/schemas/Organization'
                required: [organization]
              example:
                organization:
                  id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                  name: "Acme Inc"
                  slug: "acme-inc"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      summary: Update current organization
      operationId: updateCurrentOrganization
      security:
        - sanctum: []
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema:
            type: string
            format: ulid
          description: Organization ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                slug:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Updated organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    $ref: '#/components/schemas/Organization'
                required: [organization]
              example:
                organization:
                  id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                  name: "Acme Inc"
                  slug: "acme-inc"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/org/members:
    get:
      summary: List organization members
      operationId: listOrganizationMembers
      security:
        - sanctum: []
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema:
            type: string
            format: ulid
          description: Organization ID
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationMember'
                required: [members]
              example:
                members:
                  - id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                    name: "John Doe"
                    email: "john@example.com"
                    role: "owner"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/org/files:
    post:
      summary: Upload a file
      operationId: uploadFile
      security:
        - sanctum: []
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema:
            type: string
            format: ulid
          description: Organization ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 'File to upload (max 10 MB, allowed types: PDF, PNG, JPG, WebP)'
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  file:
                    $ref: '#/components/schemas/FileResponse'
                required: [file]
              example:
                file:
                  id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                  original_name: "document.pdf"
                  mime_type: "application/pdf"
                  size_bytes: 102400
                  sha256_hash: "a1b2c3d4e5f6..."
                  created_at: "2026-11-01T12:00:00.000000Z"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      summary: List organization files
      operationId: listFiles
      security:
        - sanctum: []
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema:
            type: string
            format: ulid
          description: Organization ID
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileListItem'
                required: [files]
              example:
                files:
                  - id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                    original_name: "document.pdf"
                    mime_type: "application/pdf"
                    size_bytes: 102400
                    sha256_hash: "a1b2c3d4e5f6..."
                    created_at: "2026-11-01T12:00:00.000000Z"
                    uploader:
                      id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                      name: "John Doe"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/org/files/{file}:
    get:
      summary: Get file metadata with download URL
      operationId: getFile
      security:
        - sanctum: []
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema:
            type: string
            format: ulid
          description: Organization ID
        - name: file
          in: path
          required: true
          schema:
            type: string
            format: ulid
          description: File ID
      responses:
        '200':
          description: File metadata with signed download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  file:
                    $ref: '#/components/schemas/FileDetail'
                required: [file]
              example:
                file:
                  id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                  original_name: "document.pdf"
                  mime_type: "application/pdf"
                  size_bytes: 102400
                  sha256_hash: "a1b2c3d4e5f6..."
                  created_at: "2026-11-01T12:00:00.000000Z"
                  uploader:
                    id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                    name: "John Doe"
                  download_url: "http://localhost/api/v1/files/download/01HX7Z9K9V9V9V9V9V9V9V9V9V?expires=...&signature=..."
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/org/notifications:
    get:
      summary: List notifications with cursor pagination
      operationId: listNotifications
      security:
        - sanctum: []
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema:
            type: string
            format: ulid
          description: Organization ID
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Cursor for pagination (created_at of last item)
        - name: unread
          in: query
          required: false
          schema:
            type: boolean
          description: Filter to unread notifications only
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  next_cursor:
                    type: string
                    format: date-time
                    nullable: true
                required: [notifications]
              example:
                notifications:
                  - id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                    type: "notification.test"
                    title_key: "notification.test.title"
                    title_params:
                      name: "John"
                    body_key: "notification.test.body"
                    body_params:
                      name: "John"
                    data:
                      target_type: "test"
                      target_id: "01HX7Z9K9V9V9V9V9V9V9V9V9V"
                    read_at: null
                    created_at: "2026-11-01T12:00:00.000000Z"
                next_cursor: "2026-11-01T11:00:00.000000Z"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/org/notifications/read-all:
    post:
      summary: Mark all notifications as read
      operationId: markAllNotificationsAsRead
      security:
        - sanctum: []
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema:
            type: string
            format: ulid
          description: Organization ID
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/org/notifications/{id}/read:
    post:
      summary: Mark notification as read
      operationId: markNotificationAsRead
      security:
        - sanctum: []
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema:
            type: string
            format: ulid
          description: Organization ID
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: ulid
          description: Notification ID
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        '401':
