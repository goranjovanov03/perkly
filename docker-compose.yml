services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: perkly
      POSTGRES_USER: perkly
      POSTGRES_PASSWORD: perkly_dev_only
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data: