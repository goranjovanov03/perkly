name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: perkly
          POSTGRES_USER: perkly
          POSTGRES_PASSWORD: perkly_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
        working-directory: backend
      - name: Copy env
        run: cp .env.example .env
        working-directory: backend
      - name: Generate key
        run: php artisan key:generate
        working-directory: backend
      - name: Run tests
        run: php artisan test
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: perkly
          DB_USERNAME: perkly
          DB_PASSWORD: perkly_dev_only
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build api client
        run: |
          npm ci
          npm run build
        working-directory: packages/api-client
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: i18n check
        run: npm run i18n:check
        working-directory: frontend

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Build api client
        run: |
          npm ci
          npm run build
        working-directory: packages/api-client
      - name: Install dependencies
        run: npm ci
        working-directory: mobile
      - name: i18n check
        run: npm run i18n:check
        working-directory: mobile